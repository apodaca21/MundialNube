name: mundialnube-v3
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tournament_db
      POSTGRES_USER: tournament_svc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.v3}
    ports:
      - "127.0.0.1:${V3_DB_PORT:-5433}:5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tournament_svc -d tournament_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - v3-db:/var/lib/postgresql/data
  activemq:
    image: apache/artemis:2.57.0-alpine
    environment:
      ARTEMIS_USER: ${BROKER_USER:-mundial}
      ARTEMIS_PASSWORD: ${BROKER_PASSWORD:?Set BROKER_PASSWORD in .env.v3}
      ANONYMOUS_LOGIN: "false"
      JAVA_ARGS_APPEND: "-Xms128m -Xmx256m"
    ports:
      - "127.0.0.1:${V3_BROKER_PORT:-61613}:61613"
    volumes:
      - v3-broker:/var/lib/artemis-instance
  migrate:
    image: ${API_IMAGE:-mundialnube-api:v3}
    build: .
    command: [--migrate]
    environment: &database
      Database__Provider: Postgres
      Database__MigrateOnStartup: "false"
      ConnectionStrings__TournamentsConnection: "Host=db;Port=5432;Database=tournament_db;Username=tournament_svc;Password=${POSTGRES_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy
  api:
    image: ${API_IMAGE:-mundialnube-api:v3}
    build: .
    restart: unless-stopped
    environment: &app
      <<: *database
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Messaging__Enabled: "true"
      Messaging__Host: activemq
      Messaging__Port: "61613"
      Messaging__Username: ${BROKER_USER:-mundial}
      Messaging__Password: ${BROKER_PASSWORD:?Set BROKER_PASSWORD in .env.v3}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      POD_NAME: compose-v3-api
    ports:
      - "127.0.0.1:${V3_API_PORT:-8183}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      activemq:
        condition: service_started
  consumer:
    image: ${API_IMAGE:-mundialnube-api:v3}
    command: [--consume]
    restart: unless-stopped
    environment:
      <<: *app
      POD_NAME: compose-v3-consumer
    depends_on:
      migrate:
        condition: service_completed_successfully
      activemq:
        condition: service_started
  prometheus:
    image: prom/prometheus:v3.16.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d"]
    ports:
      - "127.0.0.1:${V3_PROMETHEUS_PORT:-9193}:9090"
    volumes:
      - ./monitoring/v3/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - v3-prometheus:/prometheus
  tempo:
    image: grafana/tempo:3.1.1
    command: [-target=all, -config.file=/etc/tempo/tempo.yaml]
    volumes:
      - ./monitoring/v3/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - v3-tempo:/var/tempo
  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env.v3}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${V3_GRAFANA_PORT:-3103}:3000"
    volumes:
      - ./monitoring/v3/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - v3-grafana:/var/lib/grafana
volumes:
  v3-db:
  v3-broker:
  v3-prometheus:
  v3-tempo:
  v3-grafana:

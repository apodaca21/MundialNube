---
apiVersion: batch/v1
kind: Job
metadata:
  name: tournaments-migrate
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migrate
        image: mundialnube-api:dev
        imagePullPolicy: IfNotPresent
        args:
        - --migrate
        env:
        - name: Database__Provider
          value: Postgres
        - name: Database__MigrateOnStartup
          value: 'false'
        - name: ConnectionStrings__TournamentsConnection
          valueFrom:
            secretKeyRef:
              name: mundial-secrets
              key: database-connection
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

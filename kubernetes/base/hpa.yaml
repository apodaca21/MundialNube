---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tournaments-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tournaments-api
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 40
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120

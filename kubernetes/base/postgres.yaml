---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tournament-db
spec:
  serviceName: tournament-db
  replicas: 1
  selector:
    matchLabels:
      app: tournament-db
  template:
    metadata:
      labels:
        app: tournament-db
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: tournament_db
        - name: POSTGRES_USER
          value: tournament_svc
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mundial-secrets
              key: postgres-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - tournament_svc
            - -d
            - tournament_db
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tournament-db
spec:
  selector:
    app: tournament-db
  ports:
  - name: service
    port: 5432
    targetPort: 5432

apiVersion: 1
datasources:
  - name: Mundial Prometheus
    uid: mundial-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s
  - name: Mundial Tempo
    uid: mundial-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
